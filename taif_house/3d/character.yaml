# character.yaml · Taif / Palm House V8.1 · 3D phase "character", revision 6 (V8.0: the courtyard layout, the suite court v2, the HRV base; V8.1: the roof ladder, the set-back guardrail, the outdoor kitchen) · STYLE STUDY, PROVISIONAL
# Simple architectural character for the 3D model (not photorealistic): materials as flat colours and a few added elements, all
# generated by 3d/character_3d.py (called from build_3d.py) from this file and the model's own data. Nothing here changes the
# design files, the room CSVs or params.yaml; every element is a proposal for the owner to compare in the viewer (toggles) and to
# change here. Metres, CSV frame (x east, y south), levels above ±0.00 (finished ground floor).
#
# Direction: contemporary, inspired by Taif / Hijazi architecture: clean lines, natural stone, timber, deep shaded openings,
# a stone colonnade with an upper gallery around a courtyard open to the sky. Simple, not ornate. No arches between the colonnade
# columns (owner, V6.3: the arches variant of r1–r2 is removed); the arches of the house are the living's entrance and its TV niche.
# Revision 3 (V7.0): the design language (docs/DESIGN_LANGUAGE.md): cream plaster, honey stone, black steel divided-lite windows, walnut;
# the courtyard enclosure W1–W3, the stair room, the attic, the cornice and the parapets come from the base model (3d/params.yaml roof_design).
# Revision 2: lighter, warmer colours; the views rendered with the sun and shadows; the malqaf outlet on the kitchen wall (owner
# decision, studies/air_system.typ) with the sunken seating under it (variant toggle); the north-wall stone pier removed.

enabled: true
note: "style study, provisional: materials and character elements from 3d/character.yaml, for comparison; not a design decision"

# ---------- 1. materials (flat colours, RGB 0–255; glass with alpha) · revision 2: light and warm ----------
palette:                              # V7.0: docs/DESIGN_LANGUAGE.md
  plaster:     [240, 233, 216]        # warm white (cream) plaster: walls, the attic, the parapets
  stone:       [196, 160, 110]        # honey stone: the main cornice, the band, the copings, the plinth, the quoins, the columns, the bench
  stone_light: [222, 208, 180]        # matte honey-light stone: the courtyard and colonnade floors, the sunken seating, the stair
  marble:      [236, 233, 226]        # marble floors inside (V7.1)
  timber:      [96, 66, 44]           # medium-to-dark walnut (doors, soffit, cabinet, mashrabiya, louvres)
  steel:       [34, 36, 40]           # matte black steel: window frames, divided lites, the roof guards, the stair balustrades
  brass:       [176, 138, 76]         # a few brass touches in the lighting (lantern rods)
  bronze:      [48, 44, 40]           # dark metal: grates, the fountain spout, the drains
  glass:       [120, 185, 225, 110]   # transparent in the viewer
  concrete:    [205, 200, 190]        # slab edges where they show (not assigned by default)
  ground:      [222, 214, 198]        # the ground around the house in the character views (an opaque plane at the plinth's foot)
  foliage:     [104, 138, 76]
  trunk:       [122, 94, 64]
  lantern:     [255, 196, 120]        # glows in the night view
  water:       [96, 150, 172, 215]    # V8.0: the courtyard basin's water

# existing meshes of the model are re-coloured in the viewer when the character is on (first matching rule wins; the rest keep
# their phase-3 colours, e.g. the orange / red structural flags stay visible with the character off)
assign:
  - ["ff_ladder_panel", timber]       # V8.1: the ladder's closed walnut panel in the suite court
  - ["ff_ladder_pilaster|ext_kitchen_counter|ext_kitchen_grill", stone]   # V8.1: the ladder's honey-stone pilaster; the outdoor kitchen
  - ["ext_kitchen_tannour", plaster]
  - ["ff_ladder_stile|ff_ladder_rung|roof_ladder_gate|roof_guardrail_setback", steel]   # V8.1: the ladder, its gate, the set-back guardrail (black steel)
  - ["roof_air_base_door", timber]     # V8.0: the HRV base under the malqaf
  - ["roof_air_base_louvre", steel]
  - ["roof_air_base", stone]
  - ["_outer", plaster]               # outer walls with their sill and lintel pieces
  - ["_wall_", plaster]
  - ["_low_", plaster]
  - ["_slab$", plaster]               # the slab edges between the storeys are plastered over with the walls
  - ["_slab_court$|finish_court$", stone_light]   # the courtyard floor of the base model (shown when the sunken seating is off)
  - ["finish_floor", marble]         # V7.1: marble inside (the courtyard floor stays honey-light stone, below)
  - ["_door_", timber]                # the doors walnut
  - ["_rail_", steel]                 # the stair balustrades and the well railings: black steel bars
  - ["roof_cornice|ff_band|roof_coping|roof_attic_coping", stone]   # V7.0: the main cornice, the band between the floors, the copings (honey stone)
  - ["roof_attic|roof_parapet|ff_void_wall", plaster]   # V7.0: the attic, the parapets, the W3 wall piece (V8.0: no stair room)
  - ["_stair_", stone_light]
  - ["_beam_", plaster]               # B3 (behind the fascia and the parapet), R6, R11, trimmers
  - ["roof_air_head|roof_air_cap", stone]   # the malqaf head as a simple stone tower
  - ["roof_air_louvre", timber]       # its louvres timber
  - ["gf_air_grille", timber]         # the outlet grille in the kitchen's west wall, mashrabiya-type
  - ["all_col_", stone]               # inside the stone sleeves / the wall

# ---------- 2. light ----------
sun: winter-12                        # the sun of the character views (params.yaml sun positions, Taif, true north from base.typ): 21 December noon, 45° from the south: the only sun that reaches down the 3.35 m wide, 7.3 m deep courtyard (it lights the north wall above +0.8 and the gallery); the viewer's sun menu changes it

# ---------- 3. elements ----------
plinth:                               # stone base course around the outside, from the ground to +0.6
  height: 0.6
  thickness: 0.04                     # proud of the wall face; the doors cut through it
  ground: -0.3                        # the ground around the house (the viewer's ground plane)

reveal: 0.20                          # outer-wall windows: the glass set back this far from the outer wall face (deep shaded reveals)
frame: 0.05                           # black steel frame bars (section), on every window at the glass plane
lites: {pitch: 0.78, row: 1.0, bar: 0.035}   # V7.0: divided lites: mullions at ≈ 0.78 m, transoms in rows of ≈ 1.0 m (the guarding transom of W1 / W2 falls at ≈ +4.80)
quoins: {width: 0.5, thickness: 0.03, top: 6.9}   # V7.0: honey-stone quoins at the outer corners, from the plinth to the main cornice

# ---------- V7.1 (owner): the courtyard arcade and the arched enclosure windows ----------
arcade:                               # in the COURTYARD bay only (y 6.5–13.0, between C21 and C22): two slender intermediate columns and three semicircular arches under the projection
  columns: {diameter: 0.25, at_y: [8.6667, 10.8333], base: {diameter: 0.33, height: 0.12}, capital: {diameter: 0.33, height: 0.10}}   # honey stone, on x 5.80, three equal bays of 2.1667
  arch: {thickness: 0.25}             # arch plates under the soffit between the column sleeves, the crown at the soffit bottom; decorative unless the engineer uses the columns (studies/structure.typ X18)
  structural: false                   # the two columns carry nothing in the structural study; the living bay (y 13–19.25) keeps no arches (owner, V6.3)
arched_windows:                       # the courtyard enclosure windows get semicircular heads: the base model cuts each opening to its crown (params.yaml), the spandrel plate above the springing and the arched frame are drawn here
  frame: 0.05
  windows:
    - {floor: FF, at: "5.8 6.783 5.8 8.383", label: "W1-1"}
    - {floor: FF, at: "5.8 8.95 5.8 10.55", label: "W1-2"}
    - {floor: FF, at: "5.8 11.117 5.8 12.717", label: "W1-3"}
    - {floor: FF, at: "5.8 13.242 5.8 14.842", label: "W1-4"}
    - {floor: FF, at: "5.8 15.325 5.8 16.925", label: "W1-5"}
    - {floor: FF, at: "5.8 17.408 5.8 19.008", label: "W1-6"}
    - {floor: FF, at: "6 6.5 7.3 6.5", label: "W2-1"}
    - {floor: FF, at: "7.55 6.5 8.85 6.5", label: "W2-2"}
    - {floor: FF, at: "6 13.0 8.8 13.0", label: "W3"}

colonnade:                            # the three columns on x 5.6 (C21–C23, assumed Ø0.30 in the structural study), to the roof
  diameter: 0.40                      # the visible stone sleeve around the structural column
  base: {diameter: 0.50, height: 0.15}      # plain band at the foot
  capital: {diameter: 0.50, height: 0.12}   # plain band under the soffit and under the roof

soffit:                               # timber soffit under the projection (the colonnade ceiling), hiding the slab edge and the beam
  thickness: 0.05
  fascia: 0.03                        # timber fascia on the outer face of the slab edge and the upturned beam B3

# pergola: REMOVED (owner, 1 Nov 2026, studies/courtyard_layout.typ): no pergola and no shade structure over the courtyard; character_3d.py and the viewer's toggle to be updated at the next 3D build

mashrabiya:                           # timber screens (simple modern pattern) in the reveal, flush with the outer face: privacy
  depth: 0.05
  frame: 0.06
  slat: 0.03
  pitch: [0.09, 0.27]                 # vertical slats every 0.09, horizontal every 0.27
  windows:                            # "x1 y1 x2 y2" as in the plans; side = the face the screen is on (default: outward)
                                      # fire safety (owner, 1 Nov 2026, studies/fire_escape.typ): NO screen on the escape windows of the bedrooms (1–3, kids', suite) and the maid room;
                                      # mashrabiya only on non-escape windows (the office, the suite lobby, the women's majlis, the dining)
    - {floor: FF, at: "0 19.6 0 20.9", why: "owner's office west window on the driveway / street"}
    - {floor: FF, at: "0 22.0 0 23.5", why: "owner's office west window on the driveway / street"}
    - {floor: FF, at: "8.95 7.6 8.95 9.6", side: [-1, 0], why: "the only first-floor window onto the courtyard (suite lobby): privacy from the courtyard"}
    - {floor: GF, at: "5.4 0 7.8 0", why: "women's majlis north window on the north street"}
    - {floor: GF, at: "13.311 14.5 13.311 17.5", why: "dining east window on the service yard / neighbour"}

feature_walls:                        # Taif stone cladding (0.03) on selected faces; the openings on the face are cut out
  thickness: 0.03
  walls:
    - {name: "guest entrance wall: the west facade south of the living line, both floors to the parapet coping", line: "0 19.25 0 24", side: [-1, 0], z: [-0.3, 8.25]}
    - {name: "courtyard east wall (kitchen below, suite lobby above), both floors: the grille, the fountain and the sunken seating's bench are on it", line: "8.95 6.5 8.95 13.0", side: [-1, 0], z: [-0.65, 7.0]}
    - {name: "courtyard north wall: the piers beside the women's majlis glass and the band over it (the glass stays complete)", line: "4.25 6.5 8.95 6.5", side: [0, 1], z: [-0.08, 3.52]}

# fountain: REMOVED (owner, 1 Nov 2026, studies/courtyard_layout.typ): no wall fountain on the kitchen wall (the outdoor TV and the malqaf grille are there); the water basin, the planter and the tree are in the north enclosure (courtyard_layout.enclosure); character_3d.py builds no fountain until the courtyard_layout builder update

courtyard_layout:                     # clear faces: the riwaq glass x 4.35, the kitchen wall x 8.85, the women's majlis glass y 6.6, the living glass y 12.9; the soffit edge x 5.925
  step: {box: [5.925, 8.7, 8.85, 12.3], floor: -0.15, nosing: 0.08, riser_light: true}   # the seating one step down, from the colonnade edge to the kitchen wall; honey-stone nosing, linear light in the riser
  seat_height: 0.45                   # above the pit floor (seat +0.30)
  bench_back: 0.75                    # the backs' top, above ±0.00 (0.90 above the pit floor)
  bench_depth: 0.75
  benches:                            # x0 y0 x1 y1 side: the west bench on the step edge facing the TV (gaps of 0.75 at both ends to step down), the north and south benches from the kitchen wall
    - [5.925, 9.45, 6.675, 11.55, west]
    - [6.675, 8.7, 8.85, 9.45, north]
    - [6.675, 11.55, 8.85, 12.3, south]
  table: {box: [7.125, 9.9, 7.825, 11.1], height: 0.40}   # low, for meals
  tv: {wall: "8.95 6.5 8.95 13.0", y: [9.77, 11.23], z: [0.52, 1.38], model: "65in outdoor-rated (partial sun, IP55/56); size, bracket, ventilation and clearances per the chosen model"}
  tv_frame: {inner_width: 1.70, jamb_z: [0.45, 1.45], radius: 0.85, band: 0.10, proj: 0.06, material: stone}   # a semicircular honey-stone surround, visual only, no cavity
  sink_window_proposal: {y: [7.3, 8.9], note: "APPLIED 1 Nov 2026: the sink window is at y 7.3-8.9 (design_gf.typ, studies/east_wing.typ, params.yaml); the TV wall y 9.0-12.9 is solid"}
  enclosure:                          # one honey-stone box at the north end with two separate basins
    box: [5.925, 7.1, 8.85, 8.4]
    wall: 0.15
    rim: 0.45
    water: {inside: [6.075, 7.25, 7.55, 8.25], depth: 0.35, level: 0.25, spout_z: 0.60}   # a laminar lip on the divider, water over stone, no spray; own drain + overflow; pump and filter under the cover
    planter: {inside: [7.70, 7.25, 8.70, 8.25], depth: 0.70}                              # own drain; drip irrigation; fixed
    pump_cover: [6.1, 7.3, 6.6, 7.8]
    tree: {species: "Laurus nobilis standard, or clipped Ficus nitida; final choice by a Taif nursery", stem: 2.0, crown_centre: 3.0, crown_radius: 1.0}
  drainage:                           # levels (studies/courtyard_layout.typ section): the inside floors ±0.00
    court_at_glass: -0.015            # the courtyard finish at the three glass lines and the riwaq door (a 15 mm threshold, R-08)
    fall: 0.01
    court_at_edge: -0.03              # at the step edge
    pit_edge: -0.15
    pit_drain: -0.19
    pit_drain_at: [8.6, 12.1]         # SE corner of the pit: a Ø100 gully with a silt bucket
    overflow_at: [8.6, 8.9]           # NE corner: an independent gully to its own pipe east
    overflow_rim: -0.08
    pipe_z: -0.55                     # the pipe invert at the drain, 1 % east under the kitchen floor to the east yard manhole
  pergola: none

# roof (V7.0 / V8.1): the parapets, the cornice, the attic, the HRV base, the ladder and the set-back guardrail are in 3d/params.yaml `roof_design` (base model); the guards round the roof holes here

malqaf_louvres: {slats: 4, depth: 0.12, thickness: 0.04}   # timber slats in the head's three open faces (V8.0)

props:                                # scale only, simple shapes (the courtyard benches and table: courtyard_layout; the suite court's furniture: suite_court_v2)
  lanterns:                           # hanging between the columns under the soffit edge; point lights in the night view
    size: [0.25, 0.25, 0.4]
    drop: 0.6                         # rod from the soffit
    at: [[5.6, 9.75], [5.6, 16.125]]  # the middle of each span

# ---------- 4. the TV wall (V6.3, owner decision): the living's west wall solid and full height, an arched entrance and an arched TV niche ----------
tv_wall:
  entrance: {at: "4.25 13.1 4.25 14.5", head: 2.6}   # the 1.40 m entrance arch (the base model cuts the opening to +2.60 from 3d/params.yaml; the plate above its springing is drawn here)
  niche: {y: [14.75, 19.15], depth: 0.70, head: 3.1, rise: 0.45}   # the niche between the pier (y 14.5–14.75) and the south wall: 4.40 wide, 0.70 deep, a segmental arch with its crown at +3.1 under the soffit
  pier: {y: [14.5, 14.75]}
  cabinet: {y: [15.05, 18.85], depth: 0.5, height: 0.45}   # a long low cabinet; the TV centred above it; shelves at both ends; hidden LED (not modelled)
  tv: {width: 1.9, height: 1.08, bottom: 0.7}            # 85″
  shelves: {depth: 0.4, height: 2.2}
  sofa_back_x: 8.45                                        # the sofa (3.8 m, y 15.0–18.8) faces west; eye 0.55 in front of its back

# ---------- 5. views ----------
views:                                # eye-level and aerial bookmarks: CSV frame (x east, y south) + height above ±0.00 · V8.0: the five release views first
  north:      {title: "the north facade from the north street: the main cornice, the set-back attic, the malqaf on its HRV base", eye: [5.6, -13.5, 1.6], target: [6.6, 0.0, 4.6]}
  aerial_se:  {title: "aerial from the south-east: the roofline (the attic 1.40 m, the south parapet 0.70 with the set-back guardrail), the malqaf tower; no stair tower (V8.1)", eye: [27.0, 37.0, 19.0], target: [8.0, 12.0, 4.0]}
  courtyard:  {title: "the main courtyard from the seating, looking west to the arcade and the arched gallery windows", eye: [8.6, 10.6, 1.35], target: [4.4, 10.2, 2.3]}
  suite_court_sw: {title: "the suite court from its east armchair, looking west-south-west: the gym wall with the ladder's walnut panel in its stone pilaster, the stiles above the roof, the south frame", eye: [8.85, 22.05, 4.75], target: [4.3, 22.9, 5.6]}
  suite_court: {title: "the suite court from its seating, looking north to the clerestory windows and the doors", eye: [7.1, 23.35, 4.8], target: [7.4, 19.0, 5.3]}
  tv:         {title: "inside the double-height living, looking west to the TV wall", eye: [8.3, 16.9, 1.6], target: [4.35, 16.95, 1.9]}
  living:     {title: "inside the double-height living, looking north to the courtyard and its seating", eye: [7.5, 18.3, 1.6], target: [7.5, 9.6, 0.0]}
  street:     {title: "guest entrance facade from the street (west, the driveway side)", eye: [-15.0, 27.0, 1.6], target: [0.0, 16.0, 3.5]}
  aerial_sw:  {title: "aerial view from the south-west: the stepped roofline and the set-back attic", eye: [-14.0, 40.0, 18.0], target: [6.6, 11.0, 3.0]}
  w3:         {title: "inside the double-height living, looking north to the courtyard and the large arched window W3", eye: [7.3, 18.6, 1.6], target: [7.3, 13.0, 4.0]}
  night:      {title: "the courtyard at night, from the south-east corner towards the colonnade", eye: [8.6, 12.4, 1.6], target: [5.3, 8.4, 2.4], night: true}
night:                                # the night view: dark sky, the lanterns and warm room lights
  background: "#121826"
  point_lights:                       # (x, y, height, intensity): warm lights inside the rooms round the courtyard, besides the lanterns
    - [6.6, 3.2, 2.6, 0.9]            # women's majlis
    - [6.6, 16.0, 2.8, 1.1]           # double-height living
    - [11.0, 9.8, 2.5, 0.6]           # kitchen
    - [4.9, 12.0, 5.8, 0.6]           # gallery
    - [8.0, 10.5, 0.4, 0.5]           # the courtyard seating (the riser light)

# outdoor_kitchen: V8.1 built from 3d/params.yaml `outdoor_kitchen` (the counter at the east wall, the grill and tannour apart); no service gate on the lane (the farm's single 4 m main gate is the only entry)
suite_court_v2:                      # owner, 1 Nov 2026 (studies/ff_suite.typ, south_wing.typ): DATA for the 3D builder
  court: [[4.25, 20.55], [5.8, 20.55], [5.8, 19.25], [10.0, 19.25], [10.0, 24.0], [4.25, 24.0]]
  strip: [5.9, 19.35, 9.9, 20.55]    # the 1.2 m movement strip in front of the three doors
  floor_drop: 0.12                   # the court's structural slab depressed for the falls (finished floor flush with the rooms)
  fall: 0.015                        # south, away from the doors, to the box gutter at y 23.75
  furniture: [[6.0, 22.95, 8.2, 23.8, "sofa"], [5.0, 21.7, 5.75, 22.45, "armchair"], [8.45, 21.7, 9.2, 22.45, "armchair"], [6.5, 21.95, 7.7, 22.65, "table"], [4.4, 23.2, 5.0, 23.8, "tree"], [9.25, 23.2, 9.85, 23.8, "plant"]]   # V8.1: the tree pot moved off the ladder's pilaster (studies/ff_suite.typ)
  south_side: {base: 1.1, recommended: "b", options: {a: "solid wall to the frame", b: "mashrabiya screen on a 0.9 m solid base, timber or black steel lattice ≈ 40 % open", c: "1.1 m wall, open above"}, frame: "R8 + the cornice + the parapet +8.40 across"}
  entry_wardrobe: [10.0, 16.85, 10.6, 19.15]   # inside the suite bedroom: the bed out of sight from the court
  guards: [[[5.8, 19.25], [5.8, 20.55], [4.25, 20.55], [4.25, 20.85]], [[4.25, 21.75], [4.25, 24.0]], [[10.0, 19.25], [10.0, 24.0]]]   # the roof guards on the court's open edges (the gym roof / nib, the office roof); V8.1: the gap y 20.85–21.75 is the ladder's self-closing gate (base model)

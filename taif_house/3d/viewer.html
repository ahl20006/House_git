<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taif / Palm House · 3D viewer</title>
<!-- viewer.html · Taif / Palm House · opens output/taif_house_V6.2.js (the GLB as base64 + rooms, flags, sun, bookmarks and the character
     study's palette, written by build_3d.py) with three.js r147 from lib/. Works offline, straight from the repo (file://).
     Orbit: left drag · zoom: wheel · pan: right drag.
     URL options (screenshots): ?view=nw|se|top|top_gf|top_ff|top_air|eye1|eye2|eye3|living|street|north|aerial_sw|night &roof=0 &ff=0 &cut=5.0
       &sun=summer-12|winter-09|… &labels=0 &ui=0 &character=0|1 &arches=0|1 &pergola=0|1 &sunken=0|1 &railing=parapet|glass &night=0|1
     With the character on, the eye and overview views switch the sun on (character.yaml `sun`) unless the URL names one.
     The character study (3d/character.yaml) is a STYLE STUDY, PROVISIONAL: with it on, the model's meshes are re-coloured by material and
     the chr_* meshes are shown; off, the phase-3 model with its orange / red structural flags is what you see. -->
<style>
  html, body { margin: 0; height: 100%; background: #f4f2ec; font: 13px "Segoe UI", Arial, sans-serif; color: #22352e; overflow: hidden; }
  #panel { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.93); padding: 10px 14px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.15); min-width: 250px; max-width: 340px; max-height: calc(100% - 40px); overflow: auto; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; color: #2f6b4f; }
  #panel label { display: block; margin: 3px 0; }
  #panel label.sub { margin-left: 18px; }
  #panel .views button, #panel select { margin: 4px 4px 0 0; padding: 3px 8px; border: 1px solid #2f6b4f; background: #fff; color: #2f6b4f; border-radius: 3px; cursor: pointer; font: inherit; }
  #panel .views button:hover { background: #e4eedf; }
  #panel .views .eye { border-color: #b5452f; color: #b5452f; }
  #panel .views .chr { border-color: #8a5a2b; color: #8a5a2b; }
  #cut { width: 100%; }
  #legend span { display: inline-block; width: 11px; height: 11px; margin: 0 4px -1px 0; border: 1px solid #999; }
  #flags { font-size: 11px; color: #7a3a2a; margin: 6px 0 0; padding-left: 16px; max-height: 150px; overflow: auto; }
  #chrbox { border: 1px solid #c9a97a; background: #fbf5ea; padding: 6px 8px; margin: 6px 0; border-radius: 3px; }
  #chrbox b { color: #8a5a2b; }
  #chrbox .small { font-size: 11px; color: #5a4a3a; margin: 4px 0 0; }
  #note { position: absolute; bottom: 10px; left: 12px; right: 12px; color: #666; font-size: 11px; }
  #study { position: absolute; right: 16px; bottom: 12px; background: rgba(138,90,43,.9); color: #fff; font-size: 12px; padding: 4px 9px; border-radius: 3px; display: none; }
  #roomlabels { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #roomlabels div { position: absolute; transform: translate(-50%, -50%); font-size: 11px; color: #22352e; background: rgba(255,255,255,.72); padding: 1px 4px; border-radius: 2px; white-space: nowrap; }
  #north { position: absolute; right: 16px; top: 16px; width: 70px; height: 70px; }
</style>
</head>
<body>
<div id="panel">
  <h1>Taif / Palm House · <span id="ver"></span> · 3D phase 3 + character study</h1>
  <label><input type="checkbox" id="ff" checked> first floor (walls, slab, railings)</label>
  <label><input type="checkbox" id="roof" checked> roof</label>
  <label><input type="checkbox" id="labels" checked> room names (plan views)</label>
  <label>section cut at <span id="cutv">—</span><br><input type="range" id="cut" min="-4" max="10" step="0.1" value="10"></label>
  <div id="chrbox">
    <label><input type="checkbox" id="character" checked> <b>character</b> · style study, provisional (3d/character.yaml)</label>
    <label class="sub"><input type="checkbox" id="arches"> arches variant (slender columns + plain arches, GF)</label>
    <label class="sub"><input type="checkbox" id="pergola"> pergola over the north part of the courtyard</label>
    <label class="sub"><input type="checkbox" id="sunken"> sunken seating under the malqaf grille (east wall)</label>
    <label class="sub">gallery railing on B3: <select id="railing"><option value="parapet">solid parapet + coping</option><option value="glass">glass + bronze handrail</option></select></label>
    <label class="sub"><input type="checkbox" id="night"> night (lanterns and warm room lights)</label>
    <div class="small" id="chrnote"></div>
  </div>
  <div class="views">
    <button data-view="nw">north-west</button><button data-view="se">south-east</button><button data-view="top_gf">plan GF</button><button data-view="top_ff">plan FF</button><button data-view="top_air">air system (underground)</button><br>
    <button class="eye" data-view="eye1">eye 1 · living → courtyard</button><button class="eye" data-view="eye2">eye 2 · courtyard → colonnade</button><button class="eye" data-view="eye3">eye 3 · landing → gallery</button><br>
    <button class="chr" data-view="living">living → sunken seating</button><button class="chr" data-view="street">street · guest entrance</button><button class="chr" data-view="north">north facade</button><button class="chr" data-view="aerial_sw">aerial SW</button><button class="chr" data-view="night">courtyard at night</button>
  </div>
  <label>sun (Taif, true north from base.typ): <select id="sun"><option value="">off</option></select></label>
  <div id="legend"><span style="background:#ebb032"></span>assumed, not approved by the engineer &nbsp; <span style="background:#cd372d"></span>unconfirmed load path (X5) &nbsp; <span style="background:#78b9e1"></span>glass &nbsp; <span style="background:#464650"></span>railings<br>
    <span id="chrlegend"></span></div>
  <ul id="flags"></ul>
</div>
<svg id="north" viewBox="-35 -35 70 70"><g id="northg"><line x1="0" y1="25" x2="0" y2="-22" stroke="#22352e" stroke-width="2"/><polygon points="0,-30 -6,-16 6,-16" fill="#22352e"/><text x="9" y="-18" font-size="11" fill="#22352e">N</text></g><circle r="33" fill="none" stroke="#bbb"/></svg>
<div id="roomlabels"></div>
<div id="note"></div>
<div id="study"></div>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="output/taif_house_V6.2.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const data = window.TAIF_HOUSE;
  const CH = data.character && data.character.enabled ? data.character : null;
  document.getElementById('ver').textContent = data.version;
  const $ = id => document.getElementById(id);
  if (q.get('ui') === '0') { $('panel').style.display = 'none'; $('note').style.display = 'none'; }
  (data.flags || []).forEach(f => { const li = document.createElement('li'); li.textContent = f; $('flags').appendChild(li); });
  Object.keys(data.sun || {}).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = k.replace('-', ' ') + ':00 · alt ' + data.sun[k].elevation + '° · az ' + data.sun[k].azimuth + '°'; $('sun').appendChild(o); });
  // the north arrow: the plans' north is up on screen in the plan views; true north is north_bearing° east of it
  $('northg').setAttribute('transform', 'rotate(' + (data.north_bearing || 0) + ')');
  const rgb = c => new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255);
  if (CH) {
    $('arches').checked = !!CH.defaults.arches; $('pergola').checked = !!CH.defaults.pergola; $('railing').value = CH.defaults.railing; $('sunken').checked = !!CH.defaults.sunken;
    $('chrnote').textContent = CH.arches_effect;
    $('chrlegend').innerHTML = Object.keys(CH.palette).filter(k => k !== 'lantern').map(k => '<span style="background:rgb(' + CH.palette[k].slice(0, 3).join(',') + ')"></span>' + k.replace('_', ' ') + ' &nbsp;').join('');
  } else { $('chrbox').style.display = 'none'; document.querySelectorAll('.chr').forEach(b => b.style.display = 'none'); }

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.localClippingEnabled = true;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const DAY_BG = new THREE.Color(0xf4f2ec);
  scene.background = DAY_BG;
  const hemi = new THREE.HemisphereLight(0xffffff, 0x8a7a66, 0.9); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(-20, 30, -10); scene.add(sun);
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.near = 1; sun.shadow.camera.far = 200;
  sun.shadow.camera.left = sun.shadow.camera.bottom = -24; sun.shadow.camera.right = sun.shadow.camera.top = 24; sun.shadow.bias = -0.0005;
  const persp = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 500);
  const ortho = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 500);
  let camera = persp, controls = new THREE.OrbitControls(camera, renderer.domElement), mode = 'orbit';

  // the GLB (Y up, X east, Z south = y of the plans)
  const bin = Uint8Array.from(atob(data.glb), c => c.charCodeAt(0)).buffer;
  const groups = { ff: [], roof: [], gf: [], col: [], room_gf: [], room_ff: [], plancut_gf: [], plancut_ff: [], base: [], chr: {} };
  const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 10);
  let centre = new THREE.Vector3(6.6, 3.6, 12), extent = data.extent ? data.extent[0] : [0, 0, 13.3, 24];
  const glassMat = new THREE.MeshLambertMaterial({ color: 0x78b9e1, transparent: true, opacity: 0.38, side: THREE.DoubleSide, depthWrite: false, clippingPlanes: [cutPlane] });
  const chrGlassMat = new THREE.MeshLambertMaterial({ color: 0xdce8ee, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false, clippingPlanes: [cutPlane] });   // clearer glass in the character views
  const nightGlassMat = new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false, clippingPlanes: [cutPlane] });
  const lanternMat = new THREE.MeshBasicMaterial({ color: 0xffc070, side: THREE.DoubleSide, clippingPlanes: [cutPlane] });
  const charMats = {};   // the character palette (character.yaml) as materials for the re-coloured base meshes
  if (CH) Object.keys(CH.palette).forEach(k => { charMats[k] = new THREE.MeshLambertMaterial({ color: rgb(CH.palette[k]), side: THREE.DoubleSide, clippingPlanes: [cutPlane] }); });
  const assign = CH ? CH.assign.map(([re, mat]) => [new RegExp(re), mat]) : [];
  const hidden = new Set(CH ? CH.hide : []);
  const hiddenSunken = new Set(CH ? (CH.hide_when_sunken || []) : []);   // the base model's courtyard floor, replaced by the sunken seating while that variant is on
  const lights = [];     // the night lights: the lanterns and the warm room lights (character.yaml)
  new THREE.GLTFLoader().parse(bin, '', gltf => {
    gltf.scene.traverse(o => {
      if (!o.isMesh) return;
      o.geometry = o.geometry.toNonIndexed(); o.geometry.computeVertexNormals();   // flat shading, whatever the GLB carries
      const n = o.name || (o.parent && o.parent.name) || '';
      const chr = n.startsWith('chr_');
      const mat = chr ? n.split('_')[2] : '';
      const glass = chr ? mat === 'glass' : n.includes('_glass_');
      o.userData.glass = glass; o.userData.lantern = chr && mat === 'lantern';
      o.material = glass ? glassMat : new THREE.MeshLambertMaterial({ vertexColors: !!o.geometry.attributes.color, side: THREE.DoubleSide, clippingPlanes: [cutPlane] });
      o.userData.baseMat = o.material;
      o.castShadow = !glass; o.receiveShadow = true;
      if (chr) { const g = n.split('_')[1]; (groups.chr[g] = groups.chr[g] || []).push(o); return; }
      groups.base.push(o);
      if (CH) { const r = assign.find(([re]) => re.test(n)); o.userData.chrMat = r ? charMats[r[1]] : null; o.userData.hidden = hidden.has(n); o.userData.hiddenSunken = hiddenSunken.has(n); }
      if (n.startsWith('ff_')) groups.ff.push(o);
      else if (n.startsWith('roof_')) groups.roof.push(o);
      else if (n.startsWith('all_col')) groups.col.push(o);
      else groups.gf.push(o);
      if (n.startsWith('gf_room_')) groups.room_gf.push(o);
      if (n.startsWith('ff_room_')) groups.room_ff.push(o);
      if (n.startsWith('gf_plancut')) groups.plancut_gf.push(o);
      if (n.startsWith('ff_plancut')) groups.plancut_ff.push(o);
    });
    scene.add(gltf.scene);
    const bb = new THREE.Box3().setFromObject(gltf.scene);
    centre = bb.getCenter(new THREE.Vector3());
    const grid = new THREE.GridHelper(60, 60, 0xcfd3d0, 0xe3e5e0); grid.position.set(centre.x, -0.29, centre.z); scene.add(grid);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.3 }));
    ground.rotation.x = -Math.PI / 2; ground.position.set(centre.x, -0.3, centre.z); ground.receiveShadow = true; scene.add(ground);
    if (CH) {
      (CH.lights || []).forEach(p => { const l = new THREE.PointLight(0xffb070, 1.6, 9, 2); l.position.set(p[0], p[1], p[2]); l.visible = false; scene.add(l); lights.push(l); });
      (CH.night.lights || []).forEach(p => { const l = new THREE.PointLight(0xffc890, p[3], 10, 2); l.position.set(p[0], p[1], p[2]); l.visible = false; scene.add(l); lights.push(l); });
      // an opaque ground at the plinth's foot in the character views (it hides the underground air system; the shadow plane stays for the plain model)
      const dayground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshLambertMaterial({ color: rgb(CH.palette.ground || [216, 208, 192]) })); dayground.rotation.x = -Math.PI / 2; dayground.position.set(centre.x, -0.305, centre.z); dayground.receiveShadow = true; dayground.visible = false; dayground.name = 'dayground'; scene.add(dayground);
      const dark = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshLambertMaterial({ color: 0x2a2f3a })); dark.rotation.x = -Math.PI / 2; dark.position.set(centre.x, -0.31, centre.z); dark.visible = false; dark.name = 'nightground'; scene.add(dark);
    }
    grid.name = 'grid';
    if (q.get('sun')) $('sun').value = q.get('sun');
    apply();
    setView(q.get('view') || 'nw');
  });

  function apply() {
    const ff = $('ff').checked, roof = $('roof').checked;
    const chrOn = !!CH && $('character').checked, night = chrOn && $('night').checked;
    groups.ff.forEach(o => o.visible = ff);
    groups.roof.forEach(o => o.visible = roof);
    // the plan cuts (the walls and columns sectioned 1.5 m above the floor, built by build_3d.py) show only in the plan views
    groups.plancut_gf.forEach(o => o.visible = planFloor === 'GF');
    groups.plancut_ff.forEach(o => o.visible = planFloor === 'FF');
    // the character study: re-colour the base meshes by material, hide the few it replaces, show its own meshes by group
    const sunken = chrOn && $('sunken').checked;
    groups.base.forEach(o => {
      if (chrOn && o.userData.hidden) o.visible = false;
      if (sunken && o.userData.hiddenSunken) o.visible = false;
      o.material = o.userData.glass ? (night ? nightGlassMat : (chrOn ? chrGlassMat : glassMat)) : (chrOn && o.userData.chrMat ? o.userData.chrMat : o.userData.baseMat);
    });
    if (chrOn && mode !== 'top') { groups.room_gf.forEach(o => o.visible = false); groups.room_ff.forEach(o => o.visible = false); }   // the room-colour plates are for the plans: the stone floor shows instead
    const show = { base: chrOn, props: chrOn, light: chrOn, arches: chrOn && $('arches').checked, pergola: chrOn && $('pergola').checked, sunken: sunken,
                   parapet: chrOn && $('railing').value === 'parapet', glassrail: chrOn && $('railing').value === 'glass' };
    Object.keys(groups.chr).forEach(g => groups.chr[g].forEach(o => {
      o.visible = !!show[g] && (!g.startsWith('ff') || ff);
      if (o.userData.glass) o.material = night ? nightGlassMat : chrGlassMat;
      else if (o.userData.lantern) o.material = night ? lanternMat : o.userData.baseMat;
    }));
    const h = parseFloat($('cut').value);
    cutPlane.constant = h;
    $('cutv').textContent = h >= 10 ? 'off' : '+' + h.toFixed(1) + ' m';
    const k = $('sun').value, s = data.sun && data.sun[k];
    sun.castShadow = !!s && !night;
    if (s) { sun.position.set(centre.x + s.dir[0] * 60, centre.y + s.dir[1] * 60, centre.z + s.dir[2] * 60); sun.target.position.copy(centre); sun.target.updateMatrixWorld(); sun.intensity = chrOn ? 0.85 : 0.9; hemi.intensity = chrOn ? 0.7 : 0.55; }   // with the character: a soft ambient under the sun, so the shaded courtyard still reads
    else { sun.position.set(centre.x - 20, centre.y + 30, centre.z - 10); sun.target.position.copy(centre); sun.target.updateMatrixWorld(); sun.intensity = chrOn ? 0.55 : 0.7; hemi.intensity = chrOn ? 0.75 : 0.9; }
    if (night) { scene.background = new THREE.Color(CH.night.background); hemi.color.set(0x5a6a90); hemi.groundColor.set(0x1a1a20); hemi.intensity = 0.22; sun.intensity = 0.04; }
    else { scene.background = DAY_BG; hemi.color.set(0xffffff); hemi.groundColor.set(0x8a7a66); }
    lights.forEach(l => l.visible = night);
    const ng = scene.getObjectByName('nightground'); if (ng) ng.visible = night;
    const dg = scene.getObjectByName('dayground'); if (dg) dg.visible = chrOn && !night && mode !== 'top';
    const gr = scene.getObjectByName('grid'); if (gr) gr.visible = !(chrOn && mode !== 'top');
    $('study').style.display = chrOn ? 'block' : 'none';
    $('study').textContent = 'STYLE STUDY · provisional · character from 3d/character.yaml' + (chrOn ? ' · arches ' + ($('arches').checked ? 'on' : 'off') + ' · railing ' + $('railing').value + ($('pergola').checked ? ' · pergola' : '') + (sunken ? ' · sunken seating' : '') + (night ? ' · night' : (s ? ' · sun ' + k.replace('-', ' ') + ':00' : '')) : '') + (currentTitle ? ' · ' + currentTitle : '');
    note();
  }
  function note() {
    const k = $('sun').value, s = data.sun && data.sun[k];
    $('note').textContent = 'phases 1–3: slabs and finishes, walls, doors and windows, stair, colonnade, edge beam, railings' + (CH && $('character').checked ? ' + character study (style, provisional)' : '') + ' · X east · Z south · metres · finished levels GF ±0.00 / FF +' +
      data.levels.finished.FF.toFixed(2) + ', structural slab tops ' + data.levels.structural_top.GF.toFixed(2) + ' / +' + data.levels.structural_top.FF.toFixed(2) + ' (finish ' + data.levels.finish + ')' +
      (s ? ' · sun ' + k.replace('-', ' ') + ':00, altitude ' + s.elevation + '°, azimuth ' + s.azimuth + '° from true north' : '') + (currentTitle ? ' · ' + currentTitle : '');
  }
  let currentTitle = '', planFloor = '';
  function useCamera(cam) {
    if (cam === camera) return;
    controls.dispose(); camera = cam; controls = new THREE.OrbitControls(camera, renderer.domElement);
  }
  function fitOrtho() {
    const w = extent[2] - extent[0] + 4, d = extent[3] - extent[1] + 4, aspect = window.innerWidth / window.innerHeight;
    let hw = w / 2, hh = d / 2;
    if (hw / hh < aspect) hw = hh * aspect; else hh = hw / aspect;
    ortho.left = -hw; ortho.right = hw; ortho.top = hh; ortho.bottom = -hh; ortho.updateProjectionMatrix();
  }
  function setView(v) {
    const d = 30, bm = (q.get('eye') && q.get('target')) ? { title: 'custom eye (URL)', eye: q.get('eye').split(',').map(Number), target: q.get('target').split(',').map(Number) } : data.bookmarks && data.bookmarks[v];   // ?eye=X,Y,Z&target=X,Y,Z (glTF frame: X east, Y up, Z south)
    mode = v.startsWith('top') ? 'top' : (bm ? 'eye' : 'orbit');
    currentTitle = bm ? bm.title : '';
    const cx = (extent[0] + extent[2]) / 2, cz = (extent[1] + extent[3]) / 2;
    if (mode === 'top') {
      useCamera(ortho); fitOrtho();
      camera.up.set(0, 0, -1); camera.position.set(cx, 60, cz);     // north (−Z) up, east right: the plans' orientation
      controls.target.set(cx, 0, cz);
      planFloor = v === 'top_gf' ? 'GF' : v === 'top_ff' ? 'FF' : '';
      if (v === 'top_air') planFloor = 'GF';
      if (v === 'top_gf') { $('ff').checked = false; $('roof').checked = false; $('cut').value = (data.levels.finished.GF + 1.6).toFixed(1); }
      if (v === 'top_ff') { $('ff').checked = true; $('roof').checked = false; $('cut').value = (data.levels.finished.FF + 1.6).toFixed(1); }
      if (v === 'top') { $('cut').value = 10; }
      if (v === 'top_air') { $('ff').checked = false; $('roof').checked = false; $('cut').value = -0.3; }   // only what lies below the ground slab: the tower base, the tunnel, the chamber
      if (CH) { $('character').checked = false; $('night').checked = false; }                                // the plan views show the plain model
    } else if (mode === 'eye') {
      planFloor = '';
      const aerial = bm.eye[1] > 12;
      useCamera(persp); camera.fov = aerial ? 45 : 65; camera.up.set(0, 1, 0); camera.position.set(bm.eye[0], bm.eye[1], bm.eye[2]); controls.target.set(bm.target[0], bm.target[1], bm.target[2]);
      $('cut').value = 10; $('ff').checked = true; $('roof').checked = true;
      if (CH) { $('night').checked = !!bm.night; if (!q.has('sun')) $('sun').value = (!bm.night && $('character').checked) ? (CH.sun || '') : ''; }   // the character views carry the sun and its shadows (character.yaml)
    } else {
      planFloor = '';
      useCamera(persp); camera.fov = 40; camera.up.set(0, 1, 0);
      if (v === 'se') camera.position.set(centre.x + d * 0.75, centre.y + d * 0.6, centre.z + d * 0.75);
      else camera.position.set(centre.x - d * 0.75, centre.y + d * 0.6, centre.z - d * 0.75);
      controls.target.copy(centre);
      if (CH) { $('night').checked = false; if (!q.has('sun')) $('sun').value = $('character').checked ? (CH.sun || '') : ''; }
    }
    camera.updateProjectionMatrix(); controls.update(); apply();
  }
  function labels() {
    const box = $('roomlabels'); box.innerHTML = '';
    if (mode !== 'top' || !$('labels').checked) return;
    const floor = $('ff').checked ? 'FF' : 'GF', y = parseFloat($('cut').value) < 0 ? -1.0 : data.levels.finished[floor] + 0.1;
    const w = window.innerWidth, h = window.innerHeight;
    (data.rooms || []).filter(r => r.floor === floor).forEach(r => {
      const v = new THREE.Vector3(r.c[0], y, r.c[1]).project(camera);
      if (v.z > 1) return;
      const el = document.createElement('div'); el.textContent = r.name.replace(/ \(.*$/, ''); el.style.left = ((v.x + 1) / 2 * w) + 'px'; el.style.top = ((1 - v.y) / 2 * h) + 'px'; box.appendChild(el);
    });
  }
  if (q.get('ff') === '0') $('ff').checked = false;
  if (q.get('roof') === '0') $('roof').checked = false;
  if (q.get('cut')) $('cut').value = q.get('cut');
  if (q.get('labels') === '0') $('labels').checked = false;
  if (CH) {
    if (q.get('character') === '0') $('character').checked = false;
    if (q.get('arches')) $('arches').checked = q.get('arches') === '1';
    if (q.get('pergola')) $('pergola').checked = q.get('pergola') === '1';
    if (q.get('sunken')) $('sunken').checked = q.get('sunken') === '1';
    if (q.get('railing')) $('railing').value = q.get('railing');
    if (q.get('night')) $('night').checked = q.get('night') === '1';
  }
  ['ff', 'roof', 'cut', 'sun', 'labels', 'character', 'arches', 'pergola', 'sunken', 'railing', 'night'].forEach(id => $(id).addEventListener('input', apply));
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    setView(b.dataset.view);
    if (CH && !b.dataset.view.startsWith('top') && q.get('character') !== '0') { $('character').checked = true; apply(); }   // the eye and overview buttons bring the character back
  }));
  window.addEventListener('resize', () => { persp.aspect = window.innerWidth / window.innerHeight; persp.updateProjectionMatrix(); if (mode === 'top') fitOrtho(); renderer.setSize(window.innerWidth, window.innerHeight); });
  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); labels(); })();
})();
</script>
</body>
</html>

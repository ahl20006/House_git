<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taif / Palm House · 3D viewer</title>
<!-- viewer.html · Taif / Palm House · opens output/taif_house_V6.2.js (the GLB as base64, written by build_3d.py) with three.js r147 from lib/.
     Works offline, straight from the repo (file://). Orbit: left drag · zoom: wheel · pan: right drag.
     URL options for screenshots: ?view=nw|se|top&roof=0&ff=0&cut=5.0&ui=0 -->
<style>
  html, body { margin: 0; height: 100%; background: #f4f2ec; font: 13px "Segoe UI", Arial, sans-serif; color: #22352e; overflow: hidden; }
  #panel { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.92); padding: 10px 14px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.15); min-width: 220px; }
  #panel h1 { font-size: 14px; margin: 0 0 6px; color: #2f6b4f; }
  #panel label { display: block; margin: 4px 0; }
  #panel .views button { margin: 4px 4px 0 0; padding: 3px 8px; border: 1px solid #2f6b4f; background: #fff; color: #2f6b4f; border-radius: 3px; cursor: pointer; }
  #panel .views button:hover { background: #e4eedf; }
  #cut { width: 100%; }
  #note { position: absolute; bottom: 10px; left: 12px; color: #777; font-size: 11px; }
</style>
</head>
<body>
<div id="panel">
  <h1>Taif / Palm House · <span id="ver"></span></h1>
  <label><input type="checkbox" id="ff" checked> first floor (walls and slab)</label>
  <label><input type="checkbox" id="roof" checked> roof</label>
  <label>section cut at <span id="cutv">—</span><br><input type="range" id="cut" min="0" max="8" step="0.1" value="8"></label>
  <div class="views"><button data-view="nw">north-west</button><button data-view="se">south-east</button><button data-view="top">top</button></div>
</div>
<div id="note">phases 1–2: slabs, outer and interior walls (no doors, windows, columns, stair, railings yet) · X east · Z south · metres</div>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="output/taif_house_V6.2.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const data = window.TAIF_HOUSE;
  document.getElementById('ver').textContent = data.version;
  if (q.get('ui') === '0') { document.getElementById('panel').style.display = 'none'; document.getElementById('note').style.display = 'none'; }

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.localClippingEnabled = true;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf4f2ec);
  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 500);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(-20, 30, -10); scene.add(sun);

  // the GLB (Y up, X east, Z south = y of the plans)
  const bin = Uint8Array.from(atob(data.glb), c => c.charCodeAt(0)).buffer;
  const groups = { ff: [], roof: [] };
  const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 8);
  let centre = new THREE.Vector3(6.6, 3.6, 12);
  new THREE.GLTFLoader().parse(bin, '', gltf => {
    gltf.scene.traverse(o => {
      if (!o.isMesh) return;
      o.geometry = o.geometry.toNonIndexed(); o.geometry.computeVertexNormals();   // flat shading, whatever the GLB carries
      o.material = new THREE.MeshLambertMaterial({ vertexColors: !!o.geometry.attributes.color, side: THREE.DoubleSide, clippingPlanes: [cutPlane] });
      const n = o.name || (o.parent && o.parent.name) || '';
      if (n.startsWith('ff_')) groups.ff.push(o);
      if (n.startsWith('roof_')) groups.roof.push(o);
    });
    scene.add(gltf.scene);
    const bb = new THREE.Box3().setFromObject(gltf.scene);
    centre = bb.getCenter(new THREE.Vector3());
    // a ground plane and a grid
    const grid = new THREE.GridHelper(60, 60, 0xcfd3d0, 0xe3e5e0); grid.position.set(centre.x, -0.21, centre.z); scene.add(grid);
    apply();
    setView(q.get('view') || 'nw');
  });

  function apply() {
    const ff = document.getElementById('ff').checked, roof = document.getElementById('roof').checked;
    groups.ff.forEach(o => o.visible = ff);
    groups.roof.forEach(o => o.visible = roof);
    const h = parseFloat(document.getElementById('cut').value);
    cutPlane.constant = h;
    document.getElementById('cutv').textContent = h >= 8 ? 'off' : '+' + h.toFixed(1) + ' m';
  }
  function setView(v) {
    const d = 30;
    camera.up.set(0, 1, 0);
    if (v === 'top') { camera.up.set(0, 0, -1); camera.position.set(centre.x, centre.y + 45, centre.z); }   // north (-Z) up, east right
    else if (v === 'se') { camera.position.set(centre.x + d * 0.75, centre.y + d * 0.6, centre.z + d * 0.75); }
    else { camera.position.set(centre.x - d * 0.75, centre.y + d * 0.6, centre.z - d * 0.75); }
    controls.target.copy(centre); controls.update();
  }
  if (q.get('ff') === '0') document.getElementById('ff').checked = false;
  if (q.get('roof') === '0') document.getElementById('roof').checked = false;
  if (q.get('cut')) document.getElementById('cut').value = q.get('cut');
  ['ff', 'roof', 'cut'].forEach(id => document.getElementById(id).addEventListener('input', apply));
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>

# params.yaml · Taif / Palm House V9.1 · every dimension the 3D model uses (metres). Nothing is hard-coded in build_3d.py.
# The geometry itself (rooms, outline, voids, projection, doors, windows, stair, columns, beams) is read from the project files;
# these are only the levels, thicknesses, heights and the view settings. Every value marked "assumed" is to be confirmed.
version: V9.1

levels:                 # FINISHED floor levels (the levels of the plans and sections); to confirm with the engineer (OPEN_ITEMS.md item 6)
  gf_floor: 0.00        # ground floor finished level ±0.00
  ff_floor: 3.60        # first floor finished level
  roof: 7.20            # top of the structural roof slab (the roof finish lies above it)
finish: 0.08            # floor finish (screed + tiles), assumed: top of the structural slab = finished level − finish (GF −0.08, FF +3.52)
roof_finish: 0.10       # screed, insulation and waterproofing above the roof slab, assumed (finished roof +7.30)
# Finished levels are used for doors, windows, the stair (risers, arrival) and railing heights; structural levels for slabs and beams.

slab_thickness: 0.20    # the ground slab and the default for the first-floor and roof slabs; V6.3: the first-floor and roof bays take their
                        # thickness from studies/structure.typ (slabs-ff / slabs-roof: 0.30 ribbed, 0.22 flat over the double-height void,
                        # 0.20 elsewhere), all ASSUMED; the walls still run to the default underside, the thicker bays hang below it

walls:
  outer: 0.25           # outer walls, centred on the outline (wall centre lines)
  inner: 0.20           # all interior walls, incl. the maid-wing partitions (they may become aluminium partitions later)
  low_partition: 1.20   # height of the living room's low partition to the riwaq (brown in the plans), above the finished floor

railing_height: 1.10    # railings on the gallery edges and the stair well, above the finished floor (assumed)
plan_cut: 1.50          # the plan views section the walls and columns this high above the finished floor (build_3d.py plan cuts)
handrail_height: 0.90   # stair balustrades, above the nosing line (assumed)
headroom_min: 2.10      # required clear height over a stair tread, to the underside of the slab or beam above (checked in check_3d.py)
stair:
  waist: 0.15           # flight slab thickness (assumed); the stair geometry itself is read from studies/structure.typ (#let st = ...)
  balustrade: 0.04      # thickness of the modelled balustrade panels

openings:               # heights above the FINISHED floor of the storey (assumed; the plans have no heights yet)
  door_height: 2.10
  window: {sill: 0.90, head: 2.10}       # default window
  leaf: 0.05                             # modelled door leaf thickness
  glass: 0.02                            # modelled glass thickness
  # doors modelled with a glass leaf (by their first point "x y" as in the plans)
  glass_doors: ["4.25 9.1", "9.05 19.25"]  # v2: the bedroom's court door; the gym and office court doors are solid  # courtyard glass door (riwaq → courtyard), suite bedroom → suite court (1 Nov 2026: 0.9 m at x 9.05–9.95, the court's only door)
  # door heads that differ from door_height: floor, the door as in the plans "x1 y1 x2 y2", head, note
  doors:
    - {floor: GF, at: "4.25 13.1 4.25 14.5", head: 2.6, note: "the living's arched entrance from the riwaq (V6.3), no leaf; the arch head in the character layer"}
    - {floor: GF, at: "2.75 6.7 2.75 7.6", head: 1.55, note: "the store under the stair's half landing (south end since the flip, 2 Nov 2026): a low door onto the riwaq"}
  # doors in the plans that are not built now (by first point): the future lift door is a wall until the lift comes
  skip_doors: []                         # (V6.3: the lift is installed at construction; its sliding landing door is cut on both floors)
  # window heights that differ from the default: floor, the window as in the plans "x1 y1 x2 y2", sill, head, note
  windows:
    - {floor: GF, at: "5.1 6.5 5.6 6.5", sill: 0.0, head: 2.9, note: "women's majlis south glass to the courtyard, west of column C21 (x 5.8, V7.0)"}
    - {floor: GF, at: "6.0 6.5 8.1 6.5", sill: 0.0, head: 2.9, note: "women's majlis south glass to the courtyard, east of column C21"}
    - {floor: GF, at: "4.45 13.0 5.55 13.0", sill: 0.0, head: 3.32, note: "living glass to the courtyard, west of column C22 (x 5.8); V7.0: to the slab underside, one steel wall with W3 above"}
    - {floor: GF, at: "6.05 13.0 8.75 13.0", sill: 0.0, head: 3.32, note: "living glass to the courtyard, east of column C22 (x 5.8); V7.0: to the slab underside, W3 continues above it to +6.75"}
    - {floor: GF, at: "4.25 6.8 4.25 8.9", sill: 0.0, head: 2.9, note: "riwaq glass to the courtyard, north"}
    - {floor: GF, at: "4.25 10.7 4.25 12.7", sill: 0.0, head: 2.9, note: "riwaq glass to the courtyard, south"}
    - {floor: GF, at: "8.95 7.3 8.95 8.9", sill: 1.1, head: 2.1, note: "kitchen sink window onto the courtyard, over the sink, moved north (owner, 1 Nov 2026): the outdoor TV and its surround on the wall's courtyard face south of it"}
    - {floor: GF, at: "13.311 8.7 13.311 10.1", sill: 1.1, head: 2.1, note: "kitchen east window, over the cooking counter"}
    - {floor: GF, at: "12.308 3.4 12.852 4.4", sill: 1.1, head: 2.1, note: "maid room escape window in the cut wall (fire safety, owner 1 Nov 2026): one casement 1.14 × 1.00, sill +1.10, obscured glass below +1.60, no screen"}
    - {floor: GF, at: "11.548 2.0 11.874 2.6", sill: 1.6, head: 2.1, note: "maid bath vent window"}
    - {floor: GF, at: "3.6 24 6.2 24", sill: 1.8, head: 2.9, note: "men's majlis high south window"}
    - {floor: GF, at: "7.2 24 9.8 24", sill: 1.8, head: 2.9, note: "men's majlis high south window"}
    - {floor: GF, at: "10.8 24 12.6 24", sill: 1.8, head: 2.9, note: "men's majlis high south window"}
    - {floor: GF, at: "5.4 0 7.8 0", sill: 0.9, head: 2.4, note: "women's majlis north window"}
    - {floor: GF, at: "0 6.7 0 7.6", sill: 2.6, head: 3.3, note: "the stair's half-landing window on the west wall (flip, 2 Nov 2026): small, obscured, a deep shaded reveal"}
    - {floor: GF, at: "2.4 0 2.9 0", sill: 0.3, head: 2.1, note: "the family entrance's glazed side light (obscured glass), west of the door"}
    - {floor: FF, at: "0 14.6 0 15.2", sill: 1.5, head: 2.1, note: "bedroom 3 bath window"}
    - {floor: FF, at: "13.311 9.5 13.311 10.05", sill: 1.5, head: 2.1, note: "suite bath east window, 0.55 m, y 9.50–10.05 (X3, V6.3: its frame clears C33 by 0.05 m)"}
    - {floor: FF, at: "13.311 15.0 13.311 18.6", sill: 0.9, head: 2.4, note: "suite bedroom east window, its escape window (y 15.0–18.6)"}
    - {floor: FF, at: "5.3 0 8.7 0", sill: 0.9, head: 2.4, note: "kids' room north window"}
    - {floor: FF, at: "2.0 24 3.9 24", sill: 1.2, head: 2.4, note: "gym south window (v2: the gym on the west band; the TV on the wall in front of the treadmill, x 0.45-1.65)"}
    - {floor: FF, at: "10.5 24 12.8 24", sill: 0.9, head: 2.4, note: "owner's office south window (V8.1: and a 0.90 east window at y 22.8–23.7, default heights)"}
    - {floor: FF, at: "6.0 19.25 7.0 19.25", sill: 1.4, head: 2.4, note: "clerestory window of the double-height living = +5.00 … +6.00 (studies/sections.typ cl-sill / cl-head)"}
    - {floor: FF, at: "7.6 19.25 8.6 19.25", sill: 1.4, head: 2.4, note: "clerestory window of the double-height living = +5.00 … +6.00"}
    # V6.4 · courtyard enclosure option A (studies/courtyard_enclosure.typ): black steel divided-lite windows; the gallery and family living edges are no longer open edges (3d/open_edges.csv)
    # V7.1 (owner): the enclosure windows get semicircular heads; the base model cuts each opening to its crown, the character layer draws the spandrel and the arched frame
    - {floor: FF, at: "5.8 6.783 5.8 8.383", sill: 0.22, head: 3.00, note: "W1 arched window 1 of 6 on the gallery edge (V7.1): sill +3.82 on the B3 upstand, springing +5.80, crown +6.60"}
    - {floor: FF, at: "5.8 8.95 5.8 10.55", sill: 0.22, head: 3.00, note: "W1 arched window 2 of 6 on the gallery edge (V7.1): sill +3.82 on the B3 upstand, springing +5.80, crown +6.60"}
    - {floor: FF, at: "5.8 11.117 5.8 12.717", sill: 0.22, head: 3.00, note: "W1 arched window 3 of 6 on the gallery edge (V7.1): sill +3.82 on the B3 upstand, springing +5.80, crown +6.60"}
    - {floor: FF, at: "5.8 13.242 5.8 14.842", sill: 0.22, head: 3.00, note: "W1 arched window 4 of 6 on the gallery edge (V7.1): sill +3.82 on the B3 upstand, springing +5.80, crown +6.60"}
    - {floor: FF, at: "5.8 15.325 5.8 16.925", sill: 0.22, head: 3.00, note: "W1 arched window 5 of 6 on the gallery edge (V7.1): sill +3.82 on the B3 upstand, springing +5.80, crown +6.60"}
    - {floor: FF, at: "5.8 17.408 5.8 19.008", sill: 0.22, head: 3.00, note: "W1 arched window 6 of 6 on the gallery edge (V7.1): sill +3.82 on the B3 upstand, springing +5.80, crown +6.60"}
    - {floor: FF, at: "6 6.5 7.3 6.5", sill: 0.0, head: 3.00, note: "W2 arched window 1 of 2 on the family living edge (V7.1): floor to the crown +6.60, springing +5.95"}
    - {floor: FF, at: "7.55 6.5 8.85 6.5", sill: 0.0, head: 3.00, note: "W2 arched window 2 of 2 on the family living edge (V7.1): floor to the crown +6.60, springing +5.95"}
  # W3 (V7.0, enclosure option A): the living's upper courtyard side at y 13.0 east of C22: a wall piece from the ground-floor wall top (+3.32) to the R2 soffit
  # (+6.75) with the window cut in it; with the ground-floor glass to +3.32 it reads as one steel wall ±0.00 … +6.75 (build_3d.py: the void wall)
  enclosure_w3: {at: "6.0 13.0 8.8 13.0", head: 6.60, transom: 3.82}   # V7.1: ONE arched window 2.80 wide (the space between C22's sleeve and the east wall), springing +5.20, crown +6.60; the tilt lites in its lower part

structure:              # the elements taken from studies/structure.typ (phase 3: the stair – colonnade – living zone only); sizes ASSUMED there
  assumed: [C21, C22, C23, C33, B3, B5, B16, B17, B18, R11, R1, R2, R16, R17, R18]   # V7.0: R1 / R2 (the heads of W2 / W3), R16–R18 (the roof opening over the stair)   # orange in the model: "assumed, not approved by the engineer"
  unconfirmed: []                                              # v2: R6 removed (studies/structure.typ X5: improved, not verified)                                            # red: proposed load path, NOT verified (X5)
  unconfirmed_walls:                                           # the first-floor wall over the men's majlis ribs (X5, not verified), red
    - [10.0, 19.25, 10.0, 24.0]                                # v2: the court / office wall, non-load-bearing, on rib B21 (X5)
  column_to_roof: [C21, C22, C23]                              # X8 (owner decision): the colonnade continues to the roof
  edge_beam_upturned: true                                     # B3 option (b), the owner's preference; (a) drop if the engineer decides

suite_court:            # V8.0 · south wing v2 (studies/ff_suite.typ): the court's south side in the first-floor outer wall
  south_x: [4.25, 10.0]  # between the gym's east wall and the office's west wall
  base: 1.10             # the solid base (the common base of the three options; the recommended mashrabiya above it is PROPOSED, not built)
  frame_depth: 0.60      # R8 across the opening (studies/structure.typ), the cornice and the parapet on it

projection:
  width: 1.55           # the first-floor west projection over the courtyard and the double-height void (V5.0 columns solution; V6.4: +0.20 m, enclosure option A)
  # its exact edge (x 5.8) is read from studies/ff_family.typ (proj-x) and checked against this width

roof_design:            # V7.0 (studies/roof.typ, owner decisions 31 Oct 2026): the roofline and the stair to the roof, all sizes assumed
                        # V8.0: the internal stair stops at the first floor; the HRV base under the malqaf. V8.1: the roof by the MAINTENANCE LADDER in the suite court (ladder),
                        # the attic 1.40 m (V9.2: 1.38) above the roof finish, the south parapet 0.70 with a set-back GUARDRAIL (guardrail_setback)
  cornice: {z0: 6.90, h: 0.45, proj: 0.30}          # the main honey-stone cornice on the facade edge all round
  band: {z0: 3.40, h: 0.12, proj: 0.08}             # the thin stone cornice between the floors
  coping_north: {wall_top: 7.57, top: 7.65, overhang: 0.03}   # the north block: a 0.30 upstand on the cornice with its coping (the facade top)
  parapet_south: {wall_top: 7.92, top: 8.00, overhang: 0.03}  # the south wing (y ≥ 19.25): V8.1 a low parapet 0.70 above the roof finish (was 1.10 / +8.40); the fall protection is the set-back guardrail
  attic:                                              # the roof screen on the north block, set back from the facade face; its south wall on the y 19.25 line
    setback: 1.0
    thickness: 0.20
    wall_top: 8.58                                    # V9.2: 1.38 above the roof finish, coping included (2 cm lower: hidden from the north boundary); V8.1 1.40 (was 9.00 / 9.10 = 1.80)
    top: 8.68
    overhang: 0.03
    y_south: 19.25
    doors: [["3.3 0.875 4.1 0.875", "to the north strip"], ["0.875 12.0 0.875 12.8", "to the west strip"], ["2.1 19.25 2.9 19.25", "to the gym roof"], ["11.0 19.25 11.8 19.25", "to the office roof"]]   # 0.80 openings, full height of the 1.3 m screen (gated and locked to the strip: V8.1 the strip is a no-go zone)
  ladder:                                             # V8.1 (studies/roof.typ page 2): the maintenance ladder to the roof in the suite court
    pilaster: [4.35, 20.65, 4.70, 21.95]              # a honey-stone pilaster added on the court face of the gym's east wall (the 0.20 wall is not cut), full height +3.60 … +7.30
    recess: [4.40, 20.85, 4.70, 21.75]                # 0.90 wide, 0.30 deep; the back a 0.05 lining on the wall face
    stiles_y: [21.05, 21.55]                          # 0.50 overall, rungs 0.40 clear; manufactured vertical ladder, black matte, non-slip rungs, corrosion-protected, central fall-arrest rail
    rung_x: 4.60                                      # the rung centre line: 0.20 toe clearance behind
    rungs: {top: 7.30, pitch: 0.28, count: 13}        # the top rung at the roof finish, the lowest at +3.94
    foot: 3.60
    stile_top: 8.40                                   # the stiles 1.10 above the roof finish: the transfer handholds
    panel: {thickness: 0.04, finish: walnut, hinge: south, open_deg: 180, held_open: "floor drop-bolt", lock: "key cylinder outside; flush and unclimbable when closed"}
    gate: [4.25, 20.85, 4.25, 21.75]                  # the self-closing gate in the court's west guard, opening west onto the gym roof
    pad: [3.3, 20.8, 4.15, 21.8]                      # the standing landing on the gym roof, inside the guards
    light_drain: "IP65 light in the recess head; a slot drain at the pilaster's foot into the court's drain line"
  guardrail_setback:                                  # V8.1: the continuous 1.10 m black steel guardrail set back 1.0 m from the south wing's west, south and east faces
    height: 1.10
    setback: 1.0                                      # from the outer facade face (0.875 from the wall centre lines); the strip outside it is a no-go zone
    lines: [[[0.875, 19.25], [0.875, 23.125], [4.25, 23.125]], [[12.436, 19.25], [12.436, 23.125], [10.0, 23.125]]]   # from the attic's end walls to the court guards
  hrv_base:                                           # V8.0 (air system v3.1): the HRV base under the malqaf tower, one mass with it
    pts: [[8.95, 1.0], [10.731, 1.0], [12.035, 3.4], [8.95, 3.4]]   # wall centre lines: the tower's west line; V9.2 its V9.0 footprint (the cut face 0.24 m inside the cut facade)
    wall: 0.20
    top: 9.10                                         # V8.1 0.40 above the lowered attic coping (+8.70; V9.2 +8.68): part of the malqaf mass, seen by design; option: lower to 8.70 (1.25 clear inside)
    slab: 0.15
    doors: [1.3, 2.8]                                 # y: a pair of doors in its west face (the unit behind them, filters and core pulled from the roof)
    door_head: 8.80
    exhaust: [2.7, 3.05, 7.6, 8.3]                    # y0 y1 z0 z1: the exhaust louvre on its cut face
  guard: {height: 1.10, post_spacing: 1.5, bar: 0.04}   # black steel bar guards round the courtyard sky hole and the suite court's open edges

outdoor_kitchen:        # 3 Nov 2026 (owner; design_gf.typ site outlines, studies/site_plan.typ): the counter and sink against the east wall NEXT TO the kitchen service door (its north end), the grill and tannour a little apart in the yard
  ground: -0.30         # the ground outside the house
  counter: [13.45, 8.3, 14.05, 10.1]    # on the east wall face (x 13.436) south of the service door (y 7.2–8.1), under the kitchen window; a canopy over it OPTIONAL (not modelled)
  counter_top: 0.60     # 0.90 above the ground
  grill: [16.5, 12.6, 17.6, 13.8]       # a stone platform with the grill and the tannour in the yard's south part: ≥ 3 m from every door, window and the hood outlet, 13 m from the HRV intake, downwind (NW wind) of the house, ≥ 3 m from the gas cabinet
  platform_top: 0.15

sun:                    # Taif; true north from base.typ (#let north), the plans' north is 21.4° west of true north
  latitude: 21.4
  days: {summer: 172, winter: 355}   # 21 June, 21 December (day of year)
  hours: [9, 12, 15]                 # local solar time

views:                  # eye-level bookmarks: CSV frame (x east, y south) + height above ±0.00; eye 1.6 m above the floor
  eye_height: 1.6
  bookmarks:
    eye1: {title: "inside the double-height living, looking north to the courtyard", eye: [6.6, 18.6, 1.6], target: [6.6, 9.0, 2.2]}
    eye2: {title: "from the courtyard, looking west to the colonnade and the gallery above", eye: [8.8, 12.6, 1.6], target: [5.2, 8.0, 2.4]}
    eye3: {title: "from the stair landing along the first-floor gallery", eye: [4.9, 7.0, 5.2], target: [4.9, 17.0, 4.8]}   # at the gallery's start beside the landing (the family bath wall x 4.25 blocks the view from inside the landing room)

sources:                # where build_3d.py reads the geometry (paths from taif_house/)
  rooms_gf: data/rooms_gf.csv
  rooms_ff: data/rooms_ff.csv
  outline: design_gf.typ            # "#let outline-csv-gf = (...)", wall centre lines, CSV frame
  air_tower: design_gf.typ          # "#let tower-pts = (...)" (CSV frame, before placement)
  projection_edge: studies/ff_family.typ   # "#let proj-x = 5.6"
  ff_fixed: studies/ff_family.typ   # "#let fixed = (...)": stair, lift shaft, west shaft, air tower on the first floor
  open_edges: 3d/open_edges.csv
  gf_openings: presentation.typ     # "#let gf-doors = (...)" and "#let gf-windows = (...)" (the ground-floor doors and windows of the A3 set)
  ff_openings: [studies/ff_family.typ, studies/ff_suite.typ]   # "#let doors = (...)" and "#let windows = (...)" of the two first-floor studies
  structure: studies/structure.typ  # "#let st = (...)" (stair), "#let columns", "#let beams-ff", "#let beams-roof", "#let slabs-ff" / "#let slabs-roof" (slab thickness per bay, V6.3)
  sections: studies/sections.typ    # "#let cl-sill", "#let cl-head" (clerestory levels), "#let latitude"
  north: base.typ                   # "#let north = (x, y)" true north on the drawing
  fixtures_east: studies/east_wing.typ   # "#let fixtures" (kitchen counters, for the service door clash check), local + (8.95, 0)
  air_system: studies/air_system.typ   # "#let air-*": the tower head, base box, tunnel route, water channel and outlet chamber (all assumed)

output:
  glb: 3d/output/taif_house_V9.1.glb
  viewer_data: 3d/output/taif_house_V9.1.js   # the same GLB as base64 + the rooms, flags, sun and bookmarks, so viewer.html works from file://
  summary: 3d/output/model_summary.json       # what was built, for 3d/check_3d.py
